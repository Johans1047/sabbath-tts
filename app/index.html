<!doctype html>
<html lang="es" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Guía en audio</title>
  <meta name="description" content="Escucha las lecciones de la Guía de Estudio de la Biblia, también sin conexión.">
  <meta name="theme-color" content="#0e6a64">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/bricolage-grotesque-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/literata-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<!--
  THESIS: A day of the Guía de Estudio is a printed page you can also hear; the audio lives inside the page. Refuses the album-art music player.
  OWN-WORLD: Warm printing-paper ground, ink text in Literata, Bricolage Grotesque for titles and labels. One saturated week colour (7-hue ring) floods the title band edge to edge; day tabs are guide dividers; "escuchado" is an ink stamp. Night: warm dark paper, dimmed week colour.
  STORY: Open, see today's page, press Escuchar, follow the highlighted text, see the week stamped as listened.
  FIRST VIEWPORT: 390x844 phone. Week-colour band ~41% (cut from 48% so the text starts sooner): top bar, day title ~52px, lesson + date, cream "Escuchar" pill 56px, seven guide tabs fused to the page edge. Text below; player pinned at the bottom.
  FORM: La Guía de Estudio, a todo color (user-pinned, round 3; seed key a98dda11).
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
  <div class="shell" id="shell" data-view="day">
    <aside class="weeks" id="weeks" aria-label="Semanas del trimestre"></aside>
    <div class="column">
      <div class="stage" id="stage"></div>
      <div class="tools" id="tools"></div>
      <main class="page" id="page" tabindex="-1" aria-live="polite"></main>
    </div>
    <footer class="player" id="player" hidden></footer>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <script type="module" src="js/app.js"></script>
</body>
</html>
